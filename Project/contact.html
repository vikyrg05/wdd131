<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Contact Daily Student Wellness to share feedback or ask questions about student well being resources.">
    <meta name="author" content="Virginia Rocha">
    <title>Contact - Daily Student Wellness</title>
    <link rel="stylesheet" href="styles/siteplan.css">
</head>
<body>
    <header>
        <h1>Daily Student Wellness</h1>
        <nav id="nav-menu">
            <button class="menu-toggle" id="menu-toggle">☰</button>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="tips.html">Wellness</a></li>
                <li><a href="resources.html">Resources</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact Us</h2>
            <p>
                If you have questions, suggestions, or feedback about student wellness,
                please fill out the form below.
            </p>
        </section>

        <section>
            <form id="contactForm">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4" required></textarea><br><br>

                <button type="submit">Send Message</button>
            </form>

            <p id="formResponse"></p>
        </section>
    </main>

    <footer>
        <p id="footer-year"></p>
        <p id="footer-modified"></p>
        <p><a href="references.html">References</a></p>
    </footer>
    
    <script src="scripts/main.js"></script>
</body>
</html>
